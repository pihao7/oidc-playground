name: lab2-keyless-sign-ghcr
on:
  workflow_dispatch:

permissions:
  id-token: write    # keyless signing (Flow A)
  contents: read
  packages: write    # push to ghcr.io

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: Build, push, resolve digest (GITHUB_TOKEN is automatic — no secrets)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/oidc-playground:lab2"
          mkdir -p ctx && printf 'FROM alpine:3.20\nCMD ["true"]\n' > ctx/Dockerfile
          docker build -q -t "$IMAGE" ctx
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          OUT=$(docker push "$IMAGE" 2>&1); echo "$OUT" | tail -2
          DIGEST=$(echo "$OUT" | awk '/digest:/ {print $3}' | tail -1)
          echo "REF=ghcr.io/${{ github.repository_owner }}/oidc-playground@$DIGEST" >> "$GITHUB_ENV"
          echo "subject: $IMAGE@$DIGEST"

      - name: Keyless sign (Flow A — ambient OIDC token -> Fulcio -> Rekor -> referrer)
        run: cosign sign --yes "$REF"

      - name: Keyless verify (identity must match THIS repo's workflow)
        run: |
          cosign verify "$REF" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.+" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Show the Referrers API working (the thing nvcr.io lacks)
        run: |
          DIGEST="${REF##*@}"
          GHCR_TOKEN=$(curl -sS -u "${{ github.actor }}:${{ github.token }}" \
            "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/oidc-playground:pull" | jq -r .token)
          curl -sS -H "Authorization: Bearer $GHCR_TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/oidc-playground/referrers/$DIGEST" | head -c 800
