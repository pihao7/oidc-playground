name: lab8-init-publish
on:
  workflow_dispatch:
    inputs:
      exchange_url:
        description: 'NGC token-exchange endpoint base (no trailing slash)'
        required: true
      org_id:
        description: 'NGC org id'
        required: true
        default: 'org-123'
      connection_id:
        description: 'OIDC connection id'
        required: true
        default: 'conn-github'

permissions:
  id-token: write
  contents: read

jobs:
  init-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NTS_URL: ${{ inputs.exchange_url }}
      NGC_ORG: ${{ inputs.org_id }}
      NGC_CONNECTION_ID: ${{ inputs.connection_id }}
      IMAGE: nvcr.io/org-123/team-a/image:v1
    steps:
      - uses: actions/checkout@v4

      - name: init — mint + exchange + helper install + credHelpers
        run: .github/scripts/docker_credential_ngc init

      - name: Push (no docker login)
        run: |
          docker pull -q alpine:3.20 >/dev/null
          docker tag alpine:3.20 "$IMAGE"
          docker push "$IMAGE"

      - name: Pull (no docker login)
        run: |
          docker rmi "$IMAGE" >/dev/null
          docker pull "$IMAGE"
