name: lab8a-refresh
on:
  workflow_dispatch:
    inputs:
      exchange_url:
        description: 'Exchange endpoint base (tunnel A from vm1, no trailing slash)'
        required: true
      token_svc_url:
        description: 'Stage-2 token service base (tunnel B from vm1, no trailing slash)'
        required: true
      org_id:
        description: 'NGC org id'
        required: true
        default: 'org-123'
      connection_id:
        description: 'OIDC connection id — this lab uses the 30s-TTL connection'
        required: true
        default: 'conn-github-30s'
      image_store:
        description: 'docker image store: classic (default) or containerd'
        required: false
        default: 'classic'

permissions:
  id-token: write
  contents: read

jobs:
  refresh-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXCHANGE_URL: ${{ inputs.exchange_url }}
      NGC_ORG: ${{ inputs.org_id }}
      NGC_CONNECTION_ID: ${{ inputs.connection_id }}
      TOKEN_SVC_URL: ${{ inputs.token_svc_url }}
      LAB8A_IMAGE_STORE: ${{ inputs.image_store }}
      IMAGE: nvcr.io/${{ inputs.org_id }}/team-a/image:v1
      FOREIGN_IMAGE: nvcr.io/${{ inputs.org_id }}/team-b/other:v1
      DEMO_IMAGE_REF: hello-world@sha256:11a3eb1597e864c51b3f56733cb2e8a90bf0c284bfc05f9444d81c558bc848aa
    steps:
      - uses: actions/checkout@v4

      # everything slow happens BEFORE the exchange — the 30s clock starts in
      # the init step, so registry bring-up and the demo pull can't eat the TTL
      - name: 'Image store (${{ inputs.image_store }}) + TLS trust + sim registry as nvcr.io on :443'
        id: sim
        run: .github/scripts/lab8a_sim_registry.sh up

      - name: Pre-pull the demo image (before the 30s clock starts)
        run: |
          set -euo pipefail
          docker pull -q "$DEMO_IMAGE_REF" >/dev/null

      - name: Init — mint + exchange (30s credential) + install helper + credHelpers
        id: init
        run: .github/scripts/nvcr_oidc_init

      - name: Docker ops with the FRESH credential — push + pull (expect OK)
        id: fresh_ops
        run: |
          set -euo pipefail
          # guard: the fresh phase must run inside the credential's TTL — fail
          # loudly here rather than with a confusing 401 below if the gap ate it
          python3 - <<'PY'
          import os, base64, json, time
          seg = os.environ["NGC_OIDC_ACCESS_TOKEN"].split(".")[1]
          seg += "=" * (-len(seg) % 4)
          left = json.loads(base64.urlsafe_b64decode(seg))["exp"] - int(time.time())
          print(f"credential validity left: {left}s")
          assert left > 5, "credential already expired — the init-to-ops gap ate the TTL"
          PY
          docker tag "$DEMO_IMAGE_REF" "$IMAGE"
          .github/scripts/nvcr_docker push "$IMAGE"
          docker rmi "$IMAGE" >/dev/null
          .github/scripts/nvcr_docker pull "$IMAGE"
          echo "push + pull OK with the FRESH credential — the setup is sound;" \
            "the 401 below can only be the TTL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Wait out the 30s credential TTL
        id: wait
        run: |
          echo "credential TTL is 30s ($NGC_CONNECTION_ID); waiting 40s so docker op 1 starts expired"
          sleep 40
          # symmetric guard: prove the credential really is expired, so the
          # auth failure below is the TTL and nothing else (e.g. a
          # longer-TTL connection passed in at dispatch)
          python3 - <<'PY'
          import os, base64, json, time
          seg = os.environ["NGC_OIDC_ACCESS_TOKEN"].split(".")[1]
          seg += "=" * (-len(seg) % 4)
          left = json.loads(base64.urlsafe_b64decode(seg))["exp"] - int(time.time())
          print(f"credential validity left: {left}s")
          assert left < 0, f"credential still valid ({left}s left) — {os.environ['NGC_CONNECTION_ID']} is not the 30s-TTL connection"
          PY

      - name: Docker op 1 — push on an expired credential (the wrap script refreshes + retries)
        id: push_ok
        run: |
          set -euo pipefail
          # direct probe first: the token service's 401 for the expired credential,
          # verbatim — what the wrapped push below will hit and recover from
          code="$(curl -sS -o "$RUNNER_TEMP/tsvc-probe.json" -w '%{http_code}' \
            "$TOKEN_SVC_URL/auth?service=registry&scope=repository:$NGC_ORG/team-a/image:pull,push" \
            -u "\$oauthtoken:$NGC_OIDC_ACCESS_TOKEN" || true)"
          echo "direct token-service probe with the expired credential -> HTTP $code"
          cat "$RUNNER_TEMP/tsvc-probe.json"
          .github/scripts/nvcr_docker push "$IMAGE"
          echo "PUSH OK — the credential had expired; nvcr_docker refreshed + retried" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Docker op 2 — pull with the refreshed credential (expect OK)
        id: pull_ok
        run: |
          set -euo pipefail
          docker rmi "$IMAGE" >/dev/null
          .github/scripts/nvcr_docker pull "$IMAGE"
          echo "PULL OK — refreshed credential -> helper -> token service -> registry" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Negative probe — repository outside the trust policy grants (must fail)
        id: foreign_probe
        run: |
          set -euo pipefail
          if .github/scripts/nvcr_docker pull "$FOREIGN_IMAGE" > "$RUNNER_TEMP/foreign-probe.log" 2>&1; then
            echo "outcome=BREACHED" >> "$GITHUB_OUTPUT"
            echo "::error::FENCE FAILED: pull of ungranted repository succeeded"
            exit 1
          fi
          echo "outcome=held" >> "$GITHUB_OUTPUT"
          echo "denied as expected (no grant for $FOREIGN_IMAGE):"
          tail -1 "$RUNNER_TEMP/foreign-probe.log"

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          claims="$(python3 - <<'PY'
          import os, base64, json
          try:
              seg = os.environ["NGC_OIDC_ACCESS_TOKEN"].split(".")[1]
              seg += "=" * (-len(seg) % 4)
              c = json.loads(base64.urlsafe_b64decode(seg))
              print(f"ttl={c['exp'] - c['iat']}s connection={c['oidc']['connection_id']} subject={c['oidc']['subject']}")
          except Exception:
              print("claims unavailable")
          PY
          )"
          {
            echo "## Lab 8a — 401-triggered credential refresh"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Sim registry up (before the 30s clock) | ${{ steps.sim.outcome || 'not reached' }} |"
            echo "| Init (mint + exchange + helper install + credHelpers) | ${{ steps.init.outcome || 'not reached' }} — exchange #1 |"
            echo "| Fresh push + pull (inside the TTL) | ${{ steps.fresh_ops.outcome || 'not reached' }} — the setup is sound |"
            echo "| Credential confirmed expired after the wait | ${{ steps.wait.outcome || 'not reached' }} |"
            echo "| Push on the expired credential | ${{ steps.push_ok.outcome || 'not reached' }} — nvcr_docker refreshed (exchange #2, $claims) + retried |"
            echo "| Pull (op 2) | ${{ steps.pull_ok.outcome || 'not reached' }} |"
            echo "| Ungranted repo | ${{ steps.foreign_probe.outputs.outcome || 'not reached' }} — held: nvcr_docker did not refresh (a denial is not fixed by a new token) |"
            echo ""
            echo "The workflow author only ever runs .github/scripts/nvcr_docker push/pull — the expiry"
            echo "detection, re-mint + re-exchange, and retry are inside the wrap script."
            echo "Nothing is stored; every op resolves through the helper from the env."
            echo ""
            echo "### Audits (on vm1)"
            echo "- Exchange (stage 1): \`~/nvcr-exchange/exchange_audit.log\` — two OK exchanges, ttl=30s"
            echo "- Token service (stage 2): \`~/nvcr-exchange/registry_token_audit.log\` — the 401 (ExpiredSignatureError) then the OKs"
          } >> "$GITHUB_STEP_SUMMARY"
