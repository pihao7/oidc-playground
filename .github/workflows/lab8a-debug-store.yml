name: lab8a-debug-store
on:
  workflow_dispatch:

permissions:
  contents: read

# Diagnostic for the containerd-snapshotter pin in lab8a_sim_registry.sh.
# Question: with the containerd image store enabled, does dockerd spawn the
# credential helper itself (inheriting the DAEMON's environment — the claim in
# the lab8a script comments), or does the docker CLI still resolve credentials
# client-side as it does with the classic store?
#
# Rig:
#   - docker-credential-envtest — logs its parent process chain and whether
#     TEST_MARKER (set only in the step shell) is in its environment, then
#     serves a canned credential for the test host
#   - fake registry on :5000 over trusted HTTPS (self-signed cert for the name
#     in the system store — mirrors the lab: no insecure-registries anywhere) —
#     always answers the spec's 401 Bearer challenge
#   - fake token service on :5001 — logs the exact Authorization header the
#     client presented (Basic probe-user:... = the helper's credential arrived;
#     <none> = the credential was dropped somewhere in between)
#
# Same pull + push under each store; the logs discriminate the hypotheses:
#   helper spawned by dockerd + no TEST_MARKER  -> daemon-side resolution (claim TRUE)
#   helper spawned by docker + TEST_MARKER set,
#   but token service saw <none>                -> CLI-side resolution, creds
#                                                  dropped downstream (e.g. the
#                                                  ServerAddress/host-mismatch
#                                                  bug, docker/cli#4653)
#   helper spawned by docker + TEST_MARKER set,
#   token service saw Basic creds               -> containerd store works fine
#                                                  client-side (pin unnecessary
#                                                  on this docker version)

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rig — logging helper + fake HTTPS 401 registry + logging token service
        run: |
          set -euo pipefail
          echo "docker server: $(docker version --format '{{.Server.Version}}')"
          echo "runner default store: $(docker info 2>/dev/null | grep -i 'storage driver')"

          # 1. the probe helper: logs WHO spawned it and WHICH environment it
          #    inherited, then serves a canned credential for the test host
          sudo tee /usr/local/bin/docker-credential-envtest >/dev/null <<'HELPER'
          #!/bin/sh
          in=$(cat)
          gp=$(ps -o ppid= -p "$PPID" 2>/dev/null | tr -d ' ')
          {
              echo "spawn: parent=$(ps -o comm= -p "$PPID" 2>/dev/null) grandparent=$(ps -o comm= -p "$gp" 2>/dev/null)"
              echo "  env: TEST_MARKER=${TEST_MARKER:-<unset>} euid=$(id -u)"
              echo "  asked-for: $in"
          } >> /tmp/envtest-helper.log
          case "$in" in
              *envtest.invalid*) printf '{"ServerURL":"envtest.invalid","Username":"probe-user","Secret":"probe-secret"}\n' ;;
              *) printf '{}\n' ;;
          esac
          HELPER
          sudo chmod +x /usr/local/bin/docker-credential-envtest

          # 2. credHelpers for the test host — user side (CLI lookup) AND root
          #    side (daemon lookup, in case the daemon resolves credentials itself)
          for cfg in "$HOME/.docker/config.json" /root/.docker/config.json; do
              sudo mkdir -p "$(dirname "$cfg")"
              if sudo test -f "$cfg"; then
                  sudo jq '.credHelpers += {"envtest.invalid:5000": "envtest"}' "$cfg" | sudo tee "$cfg" >/dev/null
              else
                  echo '{"credHelpers":{"envtest.invalid:5000":"envtest"}}' | sudo tee "$cfg" >/dev/null
              fi
          done

          # 3. the name resolves locally; TLS is genuinely trusted (self-signed
          #    cert FOR the name, in the system store — same trick as the lab)
          echo "127.0.0.1 envtest.invalid" | sudo tee -a /etc/hosts >/dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
              -keyout "$RUNNER_TEMP/envtest.key" -out "$RUNNER_TEMP/envtest.crt" \
              -subj "/CN=envtest.invalid" -addext "subjectAltName=DNS:envtest.invalid" 2>/dev/null
          sudo cp "$RUNNER_TEMP/envtest.crt" /usr/local/share/ca-certificates/envtest.crt
          sudo update-ca-certificates

          # 4. fake token service (:5001) — logs exactly what the client presented
          cat > "$RUNNER_TEMP/tsvc.py" <<'TSVC'
          from http.server import HTTPServer, BaseHTTPRequestHandler
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  with open("/tmp/tsvc.log", "a") as f:
                      f.write(f"{self.path} | Authorization: {self.headers.get('Authorization', '<none>')}\n")
                  self.send_response(401)
                  self.end_headers()
              def log_message(self, *a): pass
          HTTPServer(("127.0.0.1", 5001), H).serve_forever()
          TSVC
          # 5. fake registry (:5000, HTTPS) — always answers with the 401 challenge
          cat > "$RUNNER_TEMP/fakereg.py" <<'FAKEREG'
          import ssl
          from http.server import HTTPServer, BaseHTTPRequestHandler
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(401)
                  self.send_header("WWW-Authenticate", 'Bearer realm="http://127.0.0.1:5001/auth",service="registry"')
                  self.send_header("Content-Length", "2")
                  self.end_headers()
                  self.wfile.write(b"{}")
              def log_message(self, *a): pass
          srv = HTTPServer(("127.0.0.1", 5000), H)
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain("/tmp/envtest.crt", "/tmp/envtest.key")
          srv.socket = ctx.wrap_socket(srv.socket, server_side=True)
          srv.serve_forever()
          FAKEREG
          cp "$RUNNER_TEMP/envtest.crt" "$RUNNER_TEMP/envtest.key" /tmp/
          nohup python3 "$RUNNER_TEMP/tsvc.py" >/dev/null 2>&1 &
          nohup python3 "$RUNNER_TEMP/fakereg.py" >/dev/null 2>&1 &
          sleep 1
          curl -sS -o /dev/null -w 'fake registry challenge: HTTP %{http_code}\n' https://envtest.invalid:5000/v2/

      - name: 'Probe — classic store (containerd-snapshotter: false)'
        run: |
          set -euo pipefail
          echo '{"features":{"containerd-snapshotter":false}}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          echo "store now: $(docker info 2>/dev/null | grep -i 'storage driver')"
          : > /tmp/envtest-helper.log; : > /tmp/tsvc.log
          export TEST_MARKER=step-env-present
          docker pull envtest.invalid:5000/ns/img:1 > "$RUNNER_TEMP/pull.log" 2>&1 \
            || echo "pull failed (expected — fake registry denies): $(tail -1 "$RUNNER_TEMP/pull.log")"
          docker pull -q alpine:3.20 >/dev/null 2>&1 || true
          docker tag alpine:3.20 envtest.invalid:5000/ns/img:1
          docker push envtest.invalid:5000/ns/img:1 > "$RUNNER_TEMP/push.log" 2>&1 \
            || echo "push failed (expected): $(tail -1 "$RUNNER_TEMP/push.log")"
          cp /tmp/envtest-helper.log "$RUNNER_TEMP/helper-classic.log"
          cp /tmp/tsvc.log "$RUNNER_TEMP/tsvc-classic.log"

      - name: 'Probe — containerd store (containerd-snapshotter: true)'
        run: |
          set -euo pipefail
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          echo "store now: $(docker info 2>/dev/null | grep -i 'storage driver')"
          : > /tmp/envtest-helper.log; : > /tmp/tsvc.log
          export TEST_MARKER=step-env-present
          docker pull envtest.invalid:5000/ns/img:1 > "$RUNNER_TEMP/pull.log" 2>&1 \
            || echo "pull failed (expected — fake registry denies): $(tail -1 "$RUNNER_TEMP/pull.log")"
          docker pull -q alpine:3.20 >/dev/null 2>&1 || true
          docker tag alpine:3.20 envtest.invalid:5000/ns/img:1
          docker push envtest.invalid:5000/ns/img:1 > "$RUNNER_TEMP/push.log" 2>&1 \
            || echo "push failed (expected): $(tail -1 "$RUNNER_TEMP/push.log")"
          cp /tmp/envtest-helper.log "$RUNNER_TEMP/helper-containerd.log"
          cp /tmp/tsvc.log "$RUNNER_TEMP/tsvc-containerd.log"

      - name: Verdict
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## lab8a-debug — who spawns the credential helper, per image store"
            echo ""
            echo "docker server: $(docker version --format '{{.Server.Version}}')"
            echo ""
            echo "| store | helper spawned by | helper saw step env | token service saw credential |"
            echo "| --- | --- | --- | --- |"
            for b in classic containerd; do
              h="$RUNNER_TEMP/helper-$b.log"; t="$RUNNER_TEMP/tsvc-$b.log"
              spawn="$(grep -m1 'spawn:' "$h" 2>/dev/null || echo 'no helper spawn logged')"
              envline="$(grep -m1 'env:' "$h" 2>/dev/null || echo '-')"
              basic="$(grep -c 'Authorization: Basic' "$t" 2>/dev/null || true)"
              none="$(grep -c 'Authorization: <none>' "$t" 2>/dev/null || true)"
              echo "| $b | \`$spawn\` | \`$envline\` | Basic x$basic, none x$none |"
            done
            echo ""
            echo "### Raw evidence"
            for b in classic containerd; do
              echo ""
              echo "**$b — helper log**"
              echo '```'
              cat "$RUNNER_TEMP/helper-$b.log" 2>/dev/null || echo "(missing)"
              echo '```'
              echo ""
              echo "**$b — token service log**"
              echo '```'
              cat "$RUNNER_TEMP/tsvc-$b.log" 2>/dev/null || echo "(missing)"
              echo '```'
            done
            echo ""
            echo "### dockerd journal (auth-related warnings)"
            echo '```'
            sudo journalctl -u docker --no-pager --since '-15 min' 2>/dev/null \
              | grep -iE "host doesn't match|credential|authoriz" | tail -15 || true
            echo '```'
          } | tee "$RUNNER_TEMP/verdict.md" >> "$GITHUB_STEP_SUMMARY"
