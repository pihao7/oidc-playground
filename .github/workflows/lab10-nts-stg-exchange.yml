name: lab10-nts-stg-exchange
on:
  workflow_dispatch:
    inputs:
      exchange_url:
        description: 'NTS/STS base URL (no trailing slash)'
        required: true
        default: 'https://stg.sts.api.nvidia.com'
      ngc_org:
        description: 'NGC org that owns the connection'
        required: true
        default: 'nvidia'
      connection_id:
        description: 'OIDC connection UUID (ngc_oidc_connection_id = <org>/<id>)'
        required: true
        default: 'edd7daec-35ac-404a-8e72-7731d3dbe19e'
      subject_audience:
        description: 'aud minted into the GitHub OIDC token (must be in connection.subject_audiences)'
        required: true
        default: 'sts.api.nvidia.com'
      audience:
        description: 'exchange audience form parameter (the NGC product)'
        required: true
        default: 'private-registry'
      registry:
        description: 'container registry for the redemption probes'
        required: true
        default: 'stg.nvcr.io'
      allow_image:
        description: 'image the trust policy authorizes (pull should succeed)'
        required: true
        default: 'nvidia/rsalagame:helloworld'
      deny_image:
        description: 'image outside the policy (pull should be denied)'
        required: true
        default: 'nvidia/node:0.1'
      cosign_image:
        description: 'sandbox image for the cosign/oras probes (push-granted policy)'
        required: true
        default: 'nvidia/pihao-lab10-cosign:lab10'
      cp_source:
        description: 'oras cp source (public image with referrers)'
        required: true
        default: 'ghcr.io/nvidia/aicr:v1.2.0'
      cp_dest:
        description: 'oras cp destination (team-scoped repo, push granted)'
        required: true
        default: 'nvidia/aabb/aicr:v1.2.0'

permissions:
  id-token: write
  contents: read

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXCHANGE_URL: ${{ inputs.exchange_url }}
      NGC_ORG: ${{ inputs.ngc_org }}
      NGC_CONNECTION_ID: ${{ inputs.connection_id }}
      OIDC_AUDIENCE: ${{ inputs.subject_audience }}
      EXCHANGE_AUDIENCE: ${{ inputs.audience }}
      REGISTRY: ${{ inputs.registry }}
      ALLOW_IMAGE: ${{ inputs.allow_image }}
      DENY_IMAGE: ${{ inputs.deny_image }}
      COSIGN_IMAGE: ${{ inputs.cosign_image }}
      CP_SOURCE: ${{ inputs.cp_source }}
      CP_DEST: ${{ inputs.cp_dest }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - uses: oras-project/setup-oras@v2

      - name: Mint GitHub OIDC token
        run: |
          set -eu
          code=""; body=""
          for attempt in 1 2 3; do
            resp=$(curl -sS -w '\n%{http_code}' \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}") \
              || { echo "::warning::mint request failed (attempt $attempt)"; sleep 5; continue; }
            code=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            [ "$code" = "200" ] && break
            echo "::warning::mint returned HTTP $code (attempt $attempt)"; sleep 5
          done
          [ "$code" = "200" ] || { echo "::error::mint failed after 3 attempts (HTTP $code)"; exit 1; }
          ID_TOKEN=$(printf '%s' "$body" | jq -er .value)
          echo "::add-mask::$ID_TOKEN"
          echo "ID_TOKEN=$ID_TOKEN" >> "$GITHUB_ENV"
          echo "minted ID token: ${#ID_TOKEN} chars, aud=$OIDC_AUDIENCE"
          printf '%s' "$ID_TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4; printf "%s%*s", $0, (l?4-l:0), ""}' | base64 -d 2>/dev/null \
            | jq '{sub, aud, repository, ref, workflow_ref, run_id, actor}' || echo "(payload decode failed)"

      - name: Exchange at NTS stg (positive)
        id: exchange
        run: |
          set -eu
          resp=$(curl -sS -D "$RUNNER_TEMP/exchange.headers" -w '\n%{http_code}' \
            -X POST "$EXCHANGE_URL/oauth/token" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode "subject_token=$ID_TOKEN" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            --data-urlencode "ngc_oidc_connection_id=$NGC_ORG/$NGC_CONNECTION_ID" \
            --data-urlencode "audience=$EXCHANGE_AUDIENCE")
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "exchange -> HTTP $code"
          printf '%s' "$body" | jq 'if .access_token then .access_token="<masked>" else . end'
          grep -iE 'cache-control|pragma' "$RUNNER_TEMP/exchange.headers" || true
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            TOK=$(printf '%s' "$body" | jq -er .access_token)
            echo "::add-mask::$TOK"
            # NGC_OIDC_ACCESS_TOKEN is the credential helper's input name — the
            # cosign/oras phase (and any docker op using credHelpers) depends on it
            echo "NGC_OIDC_ACCESS_TOKEN=$TOK" >> "$GITHUB_ENV"
            echo "EXCHANGED=$TOK" >> "$GITHUB_ENV"
            printf '%s' "$body" | jq -r '"expires_in=\(.expires_in) token_type=\(.token_type) issued_token_type=\(.issued_token_type)"'
            ttl=$(printf '%s' "$body" | jq -r .expires_in)
            if [ "$ttl" -ge 595 ] && [ "$ttl" -le 600 ]; then
              echo "expires_in within [ttl-5, ttl]: OK"
            else
              echo "::error::expires_in=$ttl outside [595,600]"
            fi
          fi

      - name: Decode + verify the exchanged JWT
        if: steps.exchange.outputs.code == '200'
        run: |
          set -eu
          python3 .github/scripts/lab10_verify_jwt.py "$EXCHANGED" "$EXCHANGE_URL/.well-known/jwks.json" | tee "$RUNNER_TEMP/jwt.json"
          grep -q '"signature": "verified"' "$RUNNER_TEMP/jwt.json" \
            || { echo "::error::exchanged JWT signature did NOT verify against the served JWKS"; exit 1; }
          iss=$(jq -r .iss "$RUNNER_TEMP/jwt.json")
          [ "$iss" = "$EXCHANGE_URL" ] || echo "::warning::iss=$iss != $EXCHANGE_URL"

      - name: Install the credential helper (wires credHelpers for the NGC hosts)
        if: steps.exchange.outputs.code == '200'
        run: .github/scripts/docker-credential-ngc setup

      - name: You can — docker login + pull an authorized repository
        id: redeem_allow
        if: steps.exchange.outputs.code == '200'
        continue-on-error: true
        run: |
          set -eu
          tmpcfg=$(mktemp -d)
          if printf '%s' "$EXCHANGED" | DOCKER_CONFIG="$tmpcfg" docker login "$REGISTRY" -u '$oauthtoken' --password-stdin 2> "$RUNNER_TEMP/login.log"; then
            echo "login=outcome-ok" >> "$GITHUB_OUTPUT"
            if DOCKER_CONFIG="$tmpcfg" docker pull "$REGISTRY/$ALLOW_IMAGE" 2> "$RUNNER_TEMP/pull.log"; then
              echo "pull=outcome-ok" >> "$GITHUB_OUTPUT"
            else
              echo "pull=outcome-denied" >> "$GITHUB_OUTPUT"
              tail -2 "$RUNNER_TEMP/pull.log"
            fi
          else
            echo "login=outcome-denied" >> "$GITHUB_OUTPUT"
            echo "docker login with the exchanged token was denied:"; tail -2 "$RUNNER_TEMP/login.log"
          fi

      - name: You can — docker push a granted repository (no docker login, via the credential helper)
        id: cosign_push
        if: steps.exchange.outputs.code == '200'
        continue-on-error: true
        run: |
          set -eu
          echo "helper diag: token_len=${#NGC_OIDC_ACCESS_TOKEN}"
          # print only the helper wiring — the config's `auths` holds the
          # runner's GITHUB_TOKEN (base64); this repo's logs are public
          echo "docker config credHelpers:"; jq '.credHelpers // {}' "${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          printf 'https://%s' "$REGISTRY" | docker-credential-ngc get > "$RUNNER_TEMP/helper.json" 2> "$RUNNER_TEMP/helper.err" \
            && jq -r '"helper served: username=\(.Username) secret_len=\(.Secret | length)"' "$RUNNER_TEMP/helper.json" \
            || { echo "helper FAILED:"; cat "$RUNNER_TEMP/helper.err"; }
          docker pull -q alpine:3.20 >/dev/null
          docker tag alpine:3.20 "$REGISTRY/$COSIGN_IMAGE"
          # default docker config: credHelpers wired by init — the helper serves
          # the exchanged token; this exercises the helper path itself
          if docker push "$REGISTRY/$COSIGN_IMAGE" > "$RUNNER_TEMP/cpush.log" 2>&1; then
            echo "push=outcome-ok" >> "$GITHUB_OUTPUT"
          else
            echo "push=outcome-denied" >> "$GITHUB_OUTPUT"
          fi
          tail -4 "$RUNNER_TEMP/cpush.log"

      - name: You can — cosign attest SLSA provenance (second predicate type)
        id: cosign_attest_slsa
        if: steps.exchange.outputs.code == '200'
        continue-on-error: true
        run: |
          set -eu
          cat > "$RUNNER_TEMP/provenance.json" <<'JSON'
          {"builder":{"id":"https://github.com/actions/runner"},"buildType":"lab10",
           "invocation":{},"buildConfig":{},"metadata":{},"materials":[]}
          JSON
          if cosign attest --yes --type slsaprovenance --predicate "$RUNNER_TEMP/provenance.json" \
              "$REGISTRY/$COSIGN_IMAGE" > "$RUNNER_TEMP/cattestslsa.log" 2>&1; then
            echo "attest_slsa=outcome-ok" >> "$GITHUB_OUTPUT"
          else
            echo "attest_slsa=outcome-denied" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/cattestslsa.log"

      - name: You can — cosign keyless sign (no signing key)
        id: cosign_sign
        if: steps.exchange.outputs.code == '200'
        continue-on-error: true
        run: |
          set -eu
          if cosign sign --yes "$REGISTRY/$COSIGN_IMAGE" > "$RUNNER_TEMP/csign.log" 2>&1; then
            echo "sign=outcome-ok" >> "$GITHUB_OUTPUT"
          else
            echo "sign=outcome-denied" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/csign.log"

      - name: You can — cosign attest an SBOM (DSSE)
        id: cosign_attest
        if: steps.exchange.outputs.code == '200'
        continue-on-error: true
        run: |
          set -eu
          cat > "$RUNNER_TEMP/sbom.cdx.json" <<'JSON'
          {"bomFormat":"CycloneDX","specVersion":"1.5","metadata":{},"components":[]}
          JSON
          if cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/sbom.cdx.json" \
              "$REGISTRY/$COSIGN_IMAGE" > "$RUNNER_TEMP/cattest.log" 2>&1; then
            echo "attest=outcome-ok" >> "$GITHUB_OUTPUT"
          else
            echo "attest=outcome-denied" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/cattest.log"

      - name: You can — OCI 1.1 native referrers (forced cosign mode)
        id: cosign_oci11
        if: steps.exchange.outputs.code == '200'
        continue-on-error: true
        run: |
          set -eu
          export COSIGN_EXPERIMENTAL=1
          ok=0
          if cosign sign --yes --registry-referrers-mode oci-1-1 \
              "$REGISTRY/$COSIGN_IMAGE" > "$RUNNER_TEMP/csign11.log" 2>&1; then
            echo "sign_oci11=outcome-ok" >> "$GITHUB_OUTPUT"; ok=1
          else
            echo "sign_oci11=outcome-denied" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/csign11.log"
          if cosign attest --yes --type cyclonedx \
              --predicate "$RUNNER_TEMP/sbom.cdx.json" \
              "$REGISTRY/$COSIGN_IMAGE" > "$RUNNER_TEMP/cattest11.log" 2>&1; then
            echo "attest_oci11=outcome-ok" >> "$GITHUB_OUTPUT"; ok=1
          else
            echo "attest_oci11=outcome-denied" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/cattest11.log"
          # the referrers index is verified by the `oras discover` step below,
          # which authenticates natively

      - name: You can — cosign verify (keyless verification)
        id: cosign_verify
        if: steps.exchange.outputs.code == '200'
        continue-on-error: true
        run: |
          set -eu
          ident="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/${GITHUB_WORKFLOW_REF#*/.github/workflows/}"
          ident="${ident%%@*}@*"
          if cosign verify "$REGISTRY/$COSIGN_IMAGE" \
              --certificate-identity-regexp "$ident" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              > "$RUNNER_TEMP/cverify.log" 2>&1; then
            echo "verify=outcome-ok" >> "$GITHUB_OUTPUT"
          else
            echo "verify=outcome-denied" >> "$GITHUB_OUTPUT"
          fi
          # trimmed: the Sigstore bundle's base64 is huge — show the facts only
          trimmed=$(jq -c '.[] | {critical, optional: (.optional | del(.Bundle, .RekorBundle, .SigstoreBundle))}' \
            "$RUNNER_TEMP/cverify.log" 2>/dev/null || true)
          if [ -n "$trimmed" ]; then printf '%.800s\n' "$trimmed"; else head -c 400 "$RUNNER_TEMP/cverify.log"; fi
          if cosign verify-attestation --type cyclonedx "$REGISTRY/$COSIGN_IMAGE" \
              --certificate-identity-regexp "$ident" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              > "$RUNNER_TEMP/cverify2.log" 2>&1; then
            echo "verify_att=outcome-ok" >> "$GITHUB_OUTPUT"
          else
            echo "verify_att=outcome-denied" >> "$GITHUB_OUTPUT"
          fi
          trimmed=$(jq -c '.[] | {critical, optional: (.optional | del(.Bundle, .RekorBundle, .SigstoreBundle))}' \
            "$RUNNER_TEMP/cverify2.log" 2>/dev/null || true)
          if [ -n "$trimmed" ]; then printf '%.800s\n' "$trimmed"; else head -c 400 "$RUNNER_TEMP/cverify2.log"; fi

      - name: You can — cosign sign a Helm chart (OCI artifact — "identical flow")
        id: cosign_chart
        if: steps.exchange.outputs.code == '200'
        continue-on-error: true
        run: |
          set -eu
          ident="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/${GITHUB_WORKFLOW_REF#*/.github/workflows/}"
          ident="${ident%%@*}@*"
          CHART_REF="$REGISTRY/${COSIGN_IMAGE%:*}:chart"
          mkdir -p "$RUNNER_TEMP/demo-chart/templates"
          printf 'apiVersion: v2\nname: demo-chart\nversion: 0.1.0\n' > "$RUNNER_TEMP/demo-chart/Chart.yaml"
          printf 'apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: lab10\n' > "$RUNNER_TEMP/demo-chart/templates/cm.yaml"
          tar -czf "$RUNNER_TEMP/demo-chart-0.1.0.tgz" -C "$RUNNER_TEMP" demo-chart
          # relative filename: oras rejects absolute paths in annotations
          (
            cd "$RUNNER_TEMP"
            if oras push "$CHART_REF" --artifact-type application/vnd.cncf.helm.chart.v1.tar+gzip \
                "demo-chart-0.1.0.tgz:application/gzip" > "$RUNNER_TEMP/oraspush.log" 2>&1; then
              echo "chart_push=outcome-ok" >> "$GITHUB_OUTPUT"
            else
              echo "chart_push=outcome-denied" >> "$GITHUB_OUTPUT"
            fi
          )
          cat "$RUNNER_TEMP/oraspush.log"
          if cosign sign --yes "$CHART_REF" > "$RUNNER_TEMP/csignchart.log" 2>&1; then
            echo "chart_sign=outcome-ok" >> "$GITHUB_OUTPUT"
          else
            echo "chart_sign=outcome-denied" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/csignchart.log"
          if cosign verify "$CHART_REF" \
              --certificate-identity-regexp "$ident" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              > "$RUNNER_TEMP/cverifychart.log" 2>&1; then
            echo "chart_verify=outcome-ok" >> "$GITHUB_OUTPUT"
          else
            echo "chart_verify=outcome-denied" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/cverifychart.log"

      - name: You can — oras discover the referrers
        id: oras_discover
        if: steps.exchange.outputs.code == '200'
        continue-on-error: true
        run: |
          set -eu
          if oras discover --format tree "$REGISTRY/$COSIGN_IMAGE" > "$RUNNER_TEMP/odisc.log" 2>&1; then
            echo "discover=outcome-ok" >> "$GITHUB_OUTPUT"
          else
            echo "discover=outcome-denied" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/odisc.log"

      - name: You can — oras cp -r (copy an image with its referrers from another registry)
        id: oras_cp
        if: steps.exchange.outputs.code == '200'
        continue-on-error: true
        run: |
          set -eu
          if oras cp -r "$CP_SOURCE" "$REGISTRY/$CP_DEST" > "$RUNNER_TEMP/ocp.log" 2>&1; then
            echo "cp=outcome-ok" >> "$GITHUB_OUTPUT"
          else
            echo "cp=outcome-denied" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/ocp.log"

      - name: You can — oras discover the copied image
        id: oras_discover_cp
        if: steps.exchange.outputs.code == '200'
        continue-on-error: true
        run: |
          set -eu
          if oras discover "$REGISTRY/$CP_DEST" > "$RUNNER_TEMP/odisccp.log" 2>&1; then
            echo "discover=outcome-ok" >> "$GITHUB_OUTPUT"
          else
            echo "discover=outcome-denied" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/odisccp.log"

      - name: You can — cosign tree (signatures and attestations of the copied image)
        id: cosign_tree
        if: steps.exchange.outputs.code == '200'
        continue-on-error: true
        run: |
          set -eu
          if cosign tree "$REGISTRY/$CP_DEST" > "$RUNNER_TEMP/ctree.log" 2>&1; then
            echo "tree=outcome-ok" >> "$GITHUB_OUTPUT"
          else
            echo "tree=outcome-denied" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/ctree.log"

      - name: You cannot — pull outside the policy (the fence)
        id: redeem_deny
        if: steps.exchange.outputs.code == '200'
        continue-on-error: true
        run: |
          set -eu
          tmpcfg=$(mktemp -d)
          printf '%s' "$EXCHANGED" | DOCKER_CONFIG="$tmpcfg" docker login "$REGISTRY" -u '$oauthtoken' --password-stdin >/dev/null 2>&1 || true
          if DOCKER_CONFIG="$tmpcfg" docker pull "$REGISTRY/$DENY_IMAGE" 2> "$RUNNER_TEMP/pull2.log"; then
            echo "pull=outcome-ok" >> "$GITHUB_OUTPUT"
            echo "::error::pull outside authorization SUCCEEDED — policy scope is not enforced"
          else
            echo "pull=outcome-denied" >> "$GITHUB_OUTPUT"
            tail -2 "$RUNNER_TEMP/pull2.log"
          fi

      - name: You cannot — push with a download-only scope
        id: redeem_push
        if: steps.exchange.outputs.code == '200'
        continue-on-error: true
        run: |
          set -eu
          tmpcfg=$(mktemp -d)
          printf '%s' "$EXCHANGED" | DOCKER_CONFIG="$tmpcfg" docker login "$REGISTRY" -u '$oauthtoken' --password-stdin >/dev/null 2>&1 || true
          docker pull -q alpine:3.20 >/dev/null
          docker tag alpine:3.20 "$REGISTRY/nvidia/rsalagame:lab10-push-probe"
          if DOCKER_CONFIG="$tmpcfg" docker push "$REGISTRY/nvidia/rsalagame:lab10-push-probe" 2> "$RUNNER_TEMP/push.log"; then
            echo "push=outcome-ok" >> "$GITHUB_OUTPUT"
            echo "::error::push with download-only scope SUCCEEDED — scope is not enforced"
          else
            echo "push=outcome-denied" >> "$GITHUB_OUTPUT"
            tail -2 "$RUNNER_TEMP/push.log"
          fi

      - name: Security — the exchange's refusals (negative matrix)
        run: |
          set -eu
          probe() {
            label="$1"; shift
            resp=$(curl -sS -w '\n%{http_code}' -X POST "$EXCHANGE_URL/oauth/token" \
              -H 'Content-Type: application/x-www-form-urlencoded' "$@") || resp=$'\nERR'
            code=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            echo "$label -> HTTP $code $(printf '%s' "$body" | head -c 200)"
            err=$(printf '%s' "$body" | tr '|`\n' '/--' | head -c 120)
            echo "| $label | $code | $err |" >> "$RUNNER_TEMP/negatives.md"
          }
          : > "$RUNNER_TEMP/negatives.md"
          probe 'grant_type=client_credentials' \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode "subject_token=$ID_TOKEN" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            --data-urlencode "ngc_oidc_connection_id=$NGC_ORG/$NGC_CONNECTION_ID" \
            --data-urlencode "audience=$EXCHANGE_AUDIENCE"
          probe 'audience=Private-Registry (case)' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode "subject_token=$ID_TOKEN" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            --data-urlencode "ngc_oidc_connection_id=$NGC_ORG/$NGC_CONNECTION_ID" \
            --data-urlencode 'audience=Private-Registry'
          probe 'unknown connection' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode "subject_token=$ID_TOKEN" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            --data-urlencode "ngc_oidc_connection_id=$NGC_ORG/00000000-0000-0000-0000-000000000000" \
            --data-urlencode "audience=$EXCHANGE_AUDIENCE"
          TAMPERED=$(printf '%s' "$ID_TOKEN" | awk -F. '{mid=substr($2,20,1); repl=(mid=="A"?"B":"A"); print $1"."substr($2,1,19) repl substr($2,21)"."$3}')
          probe 'tampered subject token' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode "subject_token=$TAMPERED" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            --data-urlencode "ngc_oidc_connection_id=$NGC_ORG/$NGC_CONNECTION_ID" \
            --data-urlencode "audience=$EXCHANGE_AUDIENCE"
          probe 'missing audience' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode "subject_token=$ID_TOKEN" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            --data-urlencode "ngc_oidc_connection_id=$NGC_ORG/$NGC_CONNECTION_ID"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$EXCHANGE_URL/oauth/token")
          echo "GET /oauth/token -> HTTP $code"
          echo "| GET /oauth/token (POST-only route) | $code | - |" >> "$RUNNER_TEMP/negatives.md"

      - name: Security — the raw GitHub token is not a registry credential
        id: control_raw
        if: always()
        continue-on-error: true
        run: |
          set -eu
          tmpcfg=$(mktemp -d)
          if printf '%s' "$ID_TOKEN" | DOCKER_CONFIG="$tmpcfg" docker login "$REGISTRY" -u '$oauthtoken' --password-stdin 2> "$RUNNER_TEMP/ctrl.log"; then
            echo "login=outcome-ok" >> "$GITHUB_OUTPUT"
            echo "::error::raw GitHub OIDC token accepted by the registry — unexpected"
          else
            echo "login=outcome-denied" >> "$GITHUB_OUTPUT"
            tail -1 "$RUNNER_TEMP/ctrl.log"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Lab 10 — NTS stg token exchange (RFC 8693)"
            echo ""
            echo "Exchange endpoint: \`$EXCHANGE_URL/oauth/token\` · connection: \`$NGC_ORG/$NGC_CONNECTION_ID\` · subject aud: \`$OIDC_AUDIENCE\` · audience: \`$EXCHANGE_AUDIENCE\`"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Exchange (positive) | HTTP ${{ steps.exchange.outputs.code || 'n/a' }} |"
            if [ -f "$RUNNER_TEMP/jwt.json" ]; then
              iss=$(jq -r .iss "$RUNNER_TEMP/jwt.json")
              aud=$(jq -r '.aud | if type == "array" then join(",") else . end' "$RUNNER_TEMP/jwt.json")
              sub=$(jq -r .sub "$RUNNER_TEMP/jwt.json")
              echo "| Exchanged JWT signature vs served JWKS | $(jq -r .signature "$RUNNER_TEMP/jwt.json") |"
              echo "| Exchanged JWT iss / aud / sub | \`$iss\` / \`$aud\` / \`$sub\` |"
              echo "| Exchanged JWT assertion.* | \`$(jq -c '.assertion // {}' "$RUNNER_TEMP/jwt.json")\` |"
            fi
            echo ""
            echo "### What you can do with the exchanged credential (registry: \`$REGISTRY\`)"
            echo ""
            echo "| Action | Result |"
            echo "| --- | --- |"
            echo "| docker login + pull $ALLOW_IMAGE (authorized) | ${{ steps.redeem_allow.outputs.pull || 'skipped (no exchanged token)' }} |"
            echo "| docker push $COSIGN_IMAGE (granted repo, no docker login — credential helper) | ${{ steps.cosign_push.outputs.push || 'skipped' }} |"
            echo "| cosign keyless sign (no signing key — Fulcio + Rekor) | ${{ steps.cosign_sign.outputs.sign || 'skipped' }} |"
            echo "| cosign attest an SBOM (DSSE) | ${{ steps.cosign_attest.outputs.attest || 'skipped' }} |"
            echo "| cosign attest SLSA provenance | ${{ steps.cosign_attest_slsa.outputs.attest_slsa || 'skipped' }} |"
            echo "| cosign verify + verify-attestation (keyless) | ${{ steps.cosign_verify.outputs.verify || 'skipped' }} / ${{ steps.cosign_verify.outputs.verify_att || 'skipped' }} |"
            echo "| oras discover the referrers | ${{ steps.oras_discover.outputs.discover || 'skipped' }} |"
            echo "| Helm chart (OCI artifact): oras push / cosign sign / verify | ${{ steps.cosign_chart.outputs.chart_push || 'skipped' }} / ${{ steps.cosign_chart.outputs.chart_sign || 'skipped' }} / ${{ steps.cosign_chart.outputs.chart_verify || 'skipped' }} |"
            echo "| oras cp -r $CP_SOURCE → $CP_DEST | ${{ steps.oras_cp.outputs.cp || 'skipped' }} |"
            echo "| oras discover the copied image | ${{ steps.oras_discover_cp.outputs.discover || 'skipped' }} |"
            echo "| cosign tree | ${{ steps.cosign_tree.outputs.tree || 'skipped' }} |"
            echo "| OCI 1.1 native referrers (forced cosign mode) | sign ${{ steps.cosign_oci11.outputs.sign_oci11 || 'skipped' }} / attest ${{ steps.cosign_oci11.outputs.attest_oci11 || 'skipped' }} |"
            echo ""
            echo "### What you cannot do (the fences)"
            echo ""
            echo "| Probe | Result |"
            echo "| --- | --- |"
            echo "| docker login (exchanged token) | ${{ steps.redeem_allow.outputs.login || 'skipped (no exchanged token)' }} |"
            echo "| pull $DENY_IMAGE (outside policy) | ${{ steps.redeem_deny.outputs.pull || 'skipped' }} |"
            echo "| push $ALLOW_IMAGE (download-only scope) | ${{ steps.redeem_push.outputs.push || 'skipped' }} |"
            echo "| docker login (raw GitHub OIDC token — not a registry credential) | ${{ steps.control_raw.outputs.login || 'n/a' }} |"
            echo ""
            echo "### The exchange's refusals (negative matrix)"
            echo ""
            echo "| Probe | HTTP | error |"
            echo "| --- | --- | --- |"
            cat "$RUNNER_TEMP/negatives.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
